<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Confirm Payment - Prototype</title>
<style>
  body { font-family: Georgia, "Times New Roman", serif; background: #FAF5EE; padding: 24px; color: #5A4632; }
  .page {
    max-width: 420px; margin: 0 auto; background: #FFFBF5;
    border: 1px solid #EAD9C2; border-radius: 14px;
    box-shadow: 0 4px 16px rgba(180, 140, 100, 0.10);
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 18px; border-bottom: 1px solid #F0E4D3;
  }
  .header h2 { font-size: 17px; margin: 0; color: #5A4632; }
  .back-btn { font-size: 13px; color: #B07D54; text-decoration: none; }

  .section { padding: 15px 18px; border-bottom: 1px solid #F5EBDD; }
  .section h3 { font-size: 12px; color: #A98B6E; margin: 0 0 10px 0; letter-spacing: 0.5px; }

  /* Product card */
  .product { display: flex; gap: 12px; align-items: center; }
  .product .img-placeholder {
    width: 64px; height: 64px; background: #F0E4D3; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; font-size: 11px; color: #B5A08A;
  }
  .product .info .name { font-size: 14px; font-weight: bold; color: #5A4632; }
  .product .info .price { font-size: 13px; color: #96785A; margin-top: 4px; }

  /* Payment info rows */
  .pay-row { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; }
  .pay-row .label { color: #96785A; }
  .pay-row .value { font-weight: 600; color: #5A4632; }

  /* Payment methods */
  .method { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; font-size: 13px; }
  .method label { display: flex; align-items: center; gap: 8px; color: #5A4632; cursor: pointer; }
  .method input[type="radio"] { accent-color: #C08B5C; }

  /* Buttons */
  .btn-row { display: flex; gap: 12px; padding: 18px; }
  .btn {
    flex: 1; text-align: center; padding: 11px 0; border-radius: 10px;
    font-size: 14px; cursor: pointer; border: 1px solid #D9C4A8; background: #FFF8EF; color: #8B6F47;
    transition: background 0.2s;
  }
  .btn.primary { background: #C08B5C; color: #FFFBF5; border-color: #C08B5C; }
  .btn.primary:hover { background: #A87848; }
  .btn:hover { background: #F5EBDD; }
</style>
</head>
<body>
<div class="page">

  <!-- Header -->
  <div class="header">
    <h2>Confirm Payment</h2>
    <a href="#" class="back-btn">← Back</a>
  </div>

  <!-- Product -->
  <div class="section">
    <h3>Product</h3>
    <div class="product">
      <div class="img-placeholder">[img]</div>
      <div class="info">
        <div class="name">Hotel Custom LEGO Keychain</div>
        <div class="price">800 pts</div>
        <div class="price" style="font-size:11px;color:#A98B6E">Min Points Required: 400 pts</div>
      </div>
    </div>
  </div>

  <!-- Payment Info -->
  <div class="section">
    <h3>Payment Info</h3>
    <div class="pay-row"><span class="label">Total Points Required</span><span class="value">800 pts</span></div>
    <div class="pay-row"><span class="label">Available Balance</span><span class="value">2,450 pts</span></div>
  </div>

  <!-- Choose Payment Method -->
  <div class="section">
    <h3>Choose Payment Method</h3>
    <div class="method">
      <label><input type="radio" name="pay" checked> Points Only (Type 1)</label>
    </div>
    <div class="method">
      <label><input type="radio" name="pay"> Points + Cash (Type 2)</label>
    </div>
    <div class="method">
      <label><input type="radio" name="pay"> Points + Voucher (Type 3)</label>
    </div>
  </div>

  <!-- Buttons -->
  <div class="btn-row">
    <div class="btn primary">Confirm Payment</div>
    <div class="btn">Cancel</div>
  </div>

</div>
<script>
  const userId = localStorage.getItem("userId") || "U-001";
  const apiRoot = localStorage.getItem("apiRoot") || "http://localhost:8081/api";
  const pid = new URLSearchParams(window.location.search).get("pid") || "P-001";
  let paymentData;
  const valueRows = document.querySelectorAll(".pay-row .value");
  const productName = document.querySelector(".product .name");
  const productPrice = document.querySelector(".product .price");
  const minimum = document.querySelector(".product .price:last-child");
  const methods = document.querySelector(".section:nth-of-type(3)");
  const button = document.querySelector(".btn.primary");
  fetch(`${apiRoot}/guest/${encodeURIComponent(userId)}/confirm-payment/${encodeURIComponent(pid)}`)
    .then(response => response.ok ? response.json() : Promise.reject(new Error("Could not load payment details")))
    .then(result => {
      if (result.code !== 0) throw new Error(result.message);
      paymentData = result.data;
      productName.textContent = paymentData.name;
      productPrice.textContent = `${paymentData.totalPointsRequired.toLocaleString()} pts`;
      minimum.textContent = `Min Points Required: ${paymentData.minPointsRequired.toLocaleString()} pts`;
      valueRows[0].textContent = `${paymentData.totalPointsRequired.toLocaleString()} pts`;
      valueRows[1].textContent = `${paymentData.availableBalance.toLocaleString()} pts`;
      methods.querySelectorAll(".method").forEach((row, index) => {
        const method = paymentData.paymentMethods[index];
        if (!method) row.remove();
        else {
          row.querySelector("label").lastChild.textContent = ` ${method.name} (Type ${index + 1})`;
          row.querySelector("input").value = method.pmid;
        }
      });
      const supplement = document.createElement("div");
      supplement.id = "supplement-fields";
      supplement.innerHTML = `
        <label style="display:block;margin-top:8px;font-size:12px;color:#96785A">
          Points to use <input id="points-used" type="number" min="${paymentData.minPointsRequired}"
            max="${paymentData.availableBalance}" value="${paymentData.totalPointsRequired}"
            style="width:90px;margin-left:8px">
        </label>
        <label style="display:block;margin-top:8px;font-size:12px;color:#96785A">
          Supplement <input id="supplement-value" type="number" min="0.01" step="0.01" value="1"
            style="width:90px;margin-left:8px">
        </label>`;
      methods.appendChild(supplement);
      const updateSupplement = () => {
        const combination = selectedMethod() !== "PM-1";
        supplement.style.display = combination ? "block" : "none";
        document.querySelector("#points-used").value = combination
          ? paymentData.minPointsRequired : paymentData.totalPointsRequired;
      };
      methods.querySelectorAll('input[name="pay"]').forEach(input =>
        input.addEventListener("change", updateSupplement));
      updateSupplement();
    })
    .catch(error => { button.textContent = error.message; button.disabled = true; });
  button.addEventListener("click", () => {
    const selected = document.querySelector('input[name="pay"]:checked');
    if (!paymentData || !selected) return;
    const pointsUsed = Number(document.querySelector("#points-used")?.value ||
      paymentData.totalPointsRequired);
    const supplementValue = Number(document.querySelector("#supplement-value")?.value || 0);
    const payload = { uid: userId, pid: paymentData.pid, pmid: selected.value, pointsUsed };
    if (selected.value === "PM-2") payload.cashUsed = supplementValue;
    if (selected.value === "PM-3") payload.voucherUsed = supplementValue;
    button.disabled = true;
    fetch(`${apiRoot}/guest/redemptions`, { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
      .then(response => response.json())
      .then(result => {
        if (result.code !== 0) throw new Error(result.message);
        alert(`Payment confirmed. Order ${result.data} is now paid.`);
      })
      .catch(error => { alert(error.message); button.disabled = false; });
  });
  function selectedMethod() {
    return document.querySelector('input[name="pay"]:checked')?.value || "PM-1";
  }
</script>
</body>
</html>
