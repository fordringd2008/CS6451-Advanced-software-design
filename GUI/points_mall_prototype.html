<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Points Mall - Prototype</title>
<style>
  body { font-family: Georgia, "Times New Roman", serif; background: #FAF5EE; padding: 24px; color: #5A4632; margin: 0; }
  .phone {
    max-width: 420px; margin: 0 auto; background: #FFFBF5;
    border: 1px solid #EAD9C2; border-radius: 14px;
    box-shadow: 0 4px 16px rgba(180, 140, 100, 0.10);
    overflow: hidden;
  }

  /* Status bar */
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 16px; font-size: 12px; color: #96785A;
  }
  .status-icons { letter-spacing: 2px; }

  /* Header */
  .header { text-align: center; padding: 10px 16px 14px; border-bottom: 1px solid #F0E4D3; }
  .header h2 { font-size: 18px; margin: 0 0 4px 0; color: #5A4632; }
  .header .balance { font-size: 13px; color: #96785A; }
  .header .balance strong { color: #C08B5C; }

  /* Product grid */
  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    padding: 14px 16px;
  }
  .card {
    border: 1px solid #EAD9C2; border-radius: 10px; background: #FFFBF5;
    padding: 8px; display: flex; flex-direction: column; align-items: center;
    text-align: center;
  }
  .card .img-placeholder {
    width: 100%; aspect-ratio: 1; background: #F0E4D3; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #B5A08A; margin-bottom: 6px;
  }
  .card .name { font-size: 11px; font-weight: bold; color: #5A4632; line-height: 1.3; min-height: 28px; }
  .card .price { font-size: 12px; color: #96785A; margin: 4px 0; }
  .card .status {
    font-size: 10px; padding: 2px 8px; border-radius: 10px;
    background: #F3E8D7; color: #8A6A3F;
  }
  .card .status.sold-out { background: #F5E0D8; color: #B0614A; }
  .card .status.low-stock { background: #FAEED9; color: #A87830; }

  /* Bottom nav */
  .bottom-nav {
    display: flex; justify-content: space-around; align-items: center;
    padding: 12px 0 14px; border-top: 1px solid #F0E4D3; background: #FFFBF5;
  }
  .nav-item { text-align: center; font-size: 11px; color: #A98B6E; text-decoration: none; }
  .nav-item .icon { font-size: 18px; display: block; margin-bottom: 2px; }
  .nav-item.active { color: #C08B5C; font-weight: bold; }
</style>
</head>
<body>
<div class="phone">

  <!-- Status bar -->
  <div class="status-bar">
    <span>9:41</span>
    <span class="status-icons">▮▮ 𝄙𝄙</span>
  </div>

  <!-- Header -->
  <div class="header">
    <h2>Points Mall</h2>
    <div class="balance">Current Points: <strong>2,450</strong></div>
  </div>

  <!-- Product grid -->
  <div class="grid">
    <div class="card">
      <div class="img-placeholder">[img]</div>
      <div class="name">Hotel Custom LEGO Keychain</div>
      <div class="price">800 pts</div>
      <span class="status">Available</span>
    </div>
    <div class="card">
      <div class="img-placeholder">[img]</div>
      <div class="name">SPA Voucher</div>
      <div class="price">2,000 pts</div>
      <span class="status low-stock">3 left</span>
    </div>
    <div class="card">
      <div class="img-placeholder">[img]</div>
      <div class="name">Dinner for Two</div>
      <div class="price">1,500 pts</div>
      <span class="status">Available</span>
    </div>
    <div class="card">
      <div class="img-placeholder">[img]</div>
      <div class="name">Family Pool Package</div>
      <div class="price">3,200 pts</div>
      <span class="status sold-out">Sold Out</span>
    </div>
    <div class="card">
      <div class="img-placeholder">[img]</div>
      <div class="name">Late Check-out Voucher</div>
      <div class="price">1,000 pts</div>
      <span class="status">Available</span>
    </div>
  </div>

  <!-- Bottom nav -->
  <div class="bottom-nav">
    <a href="#" class="nav-item"><span class="icon">⌂</span>Home</a>
    <a href="#" class="nav-item active"><span class="icon">▣</span>Points Mall</a>
    <a href="#" class="nav-item"><span class="icon">☺</span>My</a>
  </div>

</div>
</body>
</html>
