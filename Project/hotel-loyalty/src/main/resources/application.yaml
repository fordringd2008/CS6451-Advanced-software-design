spring:
  application:
    name: hotel-loyalty
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:file:./data/hotelloyalty
    driver-class-name: org.h2.Driver
    username: sa
    password:
  artemis:
    mode: embedded
    embedded:
      persistent: true
      destinations: loyalty-queue,queue.points.adjustment
  sql:
    init:
      mode: always
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

server:
  servlet:
    session:
      timeout: 30m  # session timeout (security best practice: explicit config)
mybatis:
  configuration:
    map-underscore-to-camel-case: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha