spring:
  application:
    name: hotel-loyalty
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:file:./data/hotelloyalty
    driver-class-name: org.h2.Driver
    username: sa
    password:
  artemis:
    mode: embedded
    embedded:
      persistent: true
      destinations: loyalty-queue
mybatis:
  configuration:
    map-underscore-to-camel-case: true