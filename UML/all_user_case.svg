nt-size="13" font-weight="bold" lengthAdjust="spacing" textLength="0" x="622.59" y="726.38">Extensibility</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131" x="622.59" y="748.4469">Currently supported:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="78" x="622.59" y="763.5797">- Points only</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118" x="622.59" y="778.7125">Future extensions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="99" x="622.59" y="793.8453">- Points + Cash</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120" x="622.59" y="808.9781">- Points + Voucher</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="116" x="622.59" y="824.111">- Points + Coupon</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182" x="622.59" y="839.2438">- Points + other instruments</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202" x="622.59" y="854.3766">(new instruments can be added</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173" x="626.59" y="869.5094">without changing core flow)</text></g><g id="elem_GMN24"><path d="M609.59,912.65 L609.59,1008.3141 L846.59,1008.3141 L846.59,922.65 L836.59,912.65 L609.59,912.65 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M836.59,912.65 L836.59,922.65 L846.59,922.65 L836.59,912.65 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="0" x="615.59" y="917.65">Availability</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159" x="615.59" y="939.7169">Uses persistent queue +</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164" x="615.59" y="954.8497">automatic retry to ensure</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188" x="615.59" y="969.9825">points are successfully added</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198" x="615.59" y="985.1153">even under failure or high load.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216" x="615.59" y="1000.2481">(see Quality Attribute: Availability)</text></g><!--link Guest to G1--><g id="link_Guest_G1"><path d="M63.86,250.48 C87.28,250.48 116.97,250.48 152.39,250.48 " fill="none" id="Guest-to-G1" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="158.39,250.48,149.39,246.48,153.39,250.48,149.39,254.48,158.39,250.48" style="stroke:#181818;stroke-width:1.0;"/></g><!--link Guest to G2--><g id="link_Guest_G2"><path d="M63.96,270.83 C76.01,279.14 90.69,288.24 105,294.48 C132.1,306.29 157.2626,313.9324 185.3226,320.6024 " fill="none" id="Guest-to-G2" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="191.16,321.99,183.329,316.0171,186.2955,320.8337,181.4789,323.8002,191.16,321.99" style="stroke:#181818;stroke-width:1.0;"/></g><!--link Guest to G3--><g id="link_Guest_G3"><path d="M45.35,211.55 C54.33,180.21 72.01,138.09 105,117.48 C283.47,6 371.97,70.77 578.42,111.48 C614.14,118.52 646.6592,131.6471 675.2692,145.3571 " fill="none" id="Guest-to-G3" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="680.68,147.95,674.2924,140.4535,676.171,145.7893,670.8352,147.6679,680.68,147.95" style="stroke:#181818;stroke-width:1.0;"/></g><!--link G3_Combo to G3--><g id="link_G3_Combo_G3"><path d="M399.25,165.19 C464.3,166