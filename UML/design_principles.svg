<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <style>
    .title{font:700 24px sans-serif;fill:#17324d}.head{font:700 15px sans-serif;fill:#17324d}.text{font:13px sans-serif;fill:#263746}
    .box{fill:#eef6ff;stroke:#3978a8;stroke-width:2}.center{fill:#fff4df;stroke:#c48528;stroke-width:2}.secure{fill:#e9f8ef;stroke:#338653;stroke-width:2}.arrow{stroke:#526777;stroke-width:2;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#526777"/></marker></defs>
  <text x="40" y="42" class="title">Design Principles Evidenced by the Current Implementation</text>
  <rect x="430" y="270" width="340" height="120" rx="16" class="center"/><text x="495" y="310" class="head">Hotel Loyalty application</text><text x="495" y="340" class="text">services, strategies, mappers,</text><text x="495" y="365" class="text">security and messaging components</text>
  <rect x="45" y="90" width="250" height="125" rx="12" class="box"/><text x="70" y="125" class="head">SRP</text><text x="70" y="153" class="text">controllers, services, mappers,</text><text x="70" y="177" class="text">strategies each own one role</text>
  <rect x="330" y="75" width="250" height="125" rx="12" class="box"/><text x="355" y="110" class="head">OCP</text><text x="355" y="138" class="text">add PaymentStrategy or listener</text><text x="355" y="162" class="text">without changing orchestration</text>
  <rect x="620" y="75" width="250" height="125" rx="12" class="box"/><text x="645" y="110" class="head">DIP</text><text x="645" y="138" class="text">services use interfaces and</text><text x="645" y="162" class="text">Spring-managed dependencies</text>
  <rect x="905" y="90" width="250" height="125" rx="12" class="box"/><text x="930" y="125" class="head">Encapsulation</text><text x="930" y="153" class="text">payment, state, security, and</text><text x="930" y="177" class="text">persistence rules have boundaries</text>
  <rect x="45" y="485" width="250" height="125" rx="12" class="box"/><text x="70" y="520" class="head">Separation of concerns</text><text x="70" y="548" class="text">MVC, service, mapper, messaging</text><text x="70" y="572" class="text">and security packages are separated</text>
  <rect x="330" y="500" width="250" height="125" rx="12" class="box"/><text x="355" y="535" class="head">Fail-fast validation</text><text x="355" y="563" class="text">validation rejects bad status,</text><text x="355" y="587" class="text">payment, stock, and balance early</text>
  <rect x="620" y="500" width="250" height="125" rx="12" class="secure"/><text x="645" y="535" class="head">Defensive security</text><text x="645" y="563" class="text">RBAC, ownership checks, BCrypt,</text><text x="645" y="587" class="text">generic login errors, status checks</text>
  <rect x="905" y="485" width="250" height="125" rx="12" class="box"/><text x="930" y="520" class="head">Concurrency safety</text><text x="930" y="548" class="text">conditional updates and</text><text x="930" y="572" class="text">@Transactional boundaries</text>
  <path d="M295 155C380 210 430 250 500 270M455 200C480 230 520 250 550 270M745 200C710 235 680 250 650 270M905 155C820 210 770 250 700 270M295 545C390 470 430 430 500 390M455 500C490 450 530 420 570 390M745 500C720 450 690 420 650 390M905 545C820 470 770 430 700 390" class="arrow"/>
</svg>
