<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
  <style>
    text { font-family: Arial, sans-serif; fill: #3d3024; }
    .title { font-size: 24px; font-weight: bold; }
    .label { font-size: 17px; font-weight: bold; }
    .detail { font-size: 14px; }
    .layer { stroke: #8b6f47; stroke-width: 2; rx: 12; }
    .arrow { stroke: #6f5639; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#6f5639"/>
    </marker>
  </defs>
  <text x="500" y="38" text-anchor="middle" class="title">Hotel Loyalty Layered Architecture</text>
  <rect x="160" y="70" width="680" height="82" fill="#f5e1c8" class="layer"/>
  <text x="500" y="103" text-anchor="middle" class="label">Presentation Layer</text>
  <text x="500" y="128" text-anchor="middle" class="detail">JSP / JSTL pages and browser REST clients</text>
  <rect x="160" y="182" width="680" height="82" fill="#ead6c0" class="layer"/>
  <text x="500" y="215" text-anchor="middle" class="label">Controller Layer</text>
  <text x="500" y="240" text-anchor="middle" class="detail">GuestJspController, GuestPointsController, admin controllers</text>
  <rect x="160" y="294" width="680" height="82" fill="#d9c9b4" class="layer"/>
  <text x="500" y="327" text-anchor="middle" class="label">Application / Service Layer</text>
  <text x="500" y="352" text-anchor="middle" class="detail">GuestPointsServiceImpl, product/rule/adjustment services</text>
  <rect x="160" y="406" width="680" height="82" fill="#c8d8ca" class="layer"/>
  <text x="500" y="439" text-anchor="middle" class="label">Data Access Layer</text>
  <text x="500" y="464" text-anchor="middle" class="detail">MyBatis mapper interfaces and domain objects</text>
  <rect x="160" y="518" width="680" height="62" fill="#b9c9dc" class="layer"/>
  <text x="500" y="556" text-anchor="middle" class="label">Persistence Layer: H2</text>
  <path d="M500 152 L500 182" class="arrow"/>
  <path d="M500 264 L500 294" class="arrow"/>
  <path d="M500 376 L500 406" class="arrow"/>
  <path d="M500 488 L500 518" class="arrow"/>
</svg>
