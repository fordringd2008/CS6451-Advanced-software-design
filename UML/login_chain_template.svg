<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <style>
    .title{font:700 24px sans-serif;fill:#17324d}.head{font:700 16px sans-serif;fill:#17324d}
    .text{font:14px sans-serif;fill:#263746}.node{fill:#eef6ff;stroke:#3978a8;stroke-width:2}
    .base{fill:#fff4df;stroke:#c48528;stroke-width:2}.stop{fill:#fff0f0;stroke:#b64b4b;stroke-width:2}
    .arrow{stroke:#526777;stroke-width:2;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#526777"/></marker></defs>
  <text x="40" y="40" class="title">Chain of Responsibility and Template Method: Login Post-Authentication</text>
  <rect x="40" y="90" width="270" height="110" rx="12" class="base"/>
  <text x="60" y="124" class="head">LoginPostHandler</text><text x="60" y="151" class="text">final handle(LoginContext)</text><text x="60" y="177" class="text">abstract doHandle(...)</text>
  <rect x="380" y="90" width="180" height="110" rx="12" class="node"/><text x="400" y="125" class="head">StatusCheckHandler</text><text x="400" y="153" class="text">status == NORMAL</text><text x="400" y="178" class="text">else: stop</text>
  <rect x="620" y="90" width="180" height="110" rx="12" class="node"/><text x="640" y="125" class="head">PortalMatchHandler</text><text x="640" y="153" class="text">role matches portal</text><text x="640" y="178" class="text">else: stop</text>
  <rect x="860" y="90" width="150" height="110" rx="12" class="node"/><text x="875" y="125" class="head">LoginLogHandler</text><text x="875" y="153" class="text">write login log</text>
  <rect x="1040" y="90" width="130" height="110" rx="12" class="node"/><text x="1055" y="125" class="head">RedirectHandler</text><text x="1055" y="153" class="text">choose URL</text>
  <path d="M310 145H380M560 145H620M800 145H860M1010 145H1040" class="arrow"/>
  <rect x="150" y="300" width="900" height="110" rx="12" class="base"/>
  <text x="175" y="335" class="head">Template method execution in LoginPostHandler.handle()</text>
  <text x="175" y="365" class="text">1. invoke doHandle(ctx)  →  2. if true and next exists, invoke next.handle(ctx)  →  3. return false immediately when a handler rejects</text>
  <text x="175" y="391" class="text">Concrete subclasses supply only their own rule; traversal and interruption remain fixed in the superclass.</text>
  <path d="M510 200V300" class="arrow"/>
  <rect x="150" y="490" width="400" height="90" rx="12" class="stop"/><text x="175" y="525" class="head">Interrupt path</text><text x="175" y="553" class="text">invalid status or portal → session invalidated → login error</text>
  <rect x="650" y="490" width="400" height="90" rx="12" class="node"/><text x="675" y="525" class="head">Success path</text><text x="675" y="553" class="text">all handlers pass → redirect to guest or admin portal</text>
  <path d="M380 200C330 250 300 430 350 490M1040 200C950 250 900 430 850 490" class="arrow"/>
</svg>
