<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <style>
    .title{font:700 24px sans-serif;fill:#17324d}.label{font:600 16px sans-serif;fill:#17324d}
    .text{font:14px sans-serif;fill:#263746}.box{fill:#eef6ff;stroke:#3978a8;stroke-width:2}
    .db{fill:#fff4df;stroke:#c48528;stroke-width:2}.ok{fill:#e9f8ef;stroke:#338653;stroke-width:2}
    .fail{fill:#fff0f0;stroke:#b64b4b;stroke-width:2}.arrow{stroke:#526777;stroke-width:2;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#526777"/></marker></defs>
  <text x="40" y="42" class="title">Optimistic Concurrency in GuestPointsServiceImpl</text>
  <rect x="40" y="90" width="220" height="100" rx="12" class="box"/>
  <text x="60" y="120" class="label">Guest redemption request</text><text x="60" y="148" class="text">points and product ID</text><text x="60" y="171" class="text">arrive at the service</text>
  <rect x="340" y="90" width="260" height="100" rx="12" class="box"/>
  <text x="360" y="120" class="label">Read current values</text><text x="360" y="148" class="text">User points and product stock</text><text x="360" y="171" class="text">are loaded before update</text>
  <rect x="700" y="70" width="330" height="140" rx="12" class="db"/>
  <text x="720" y="104" class="label">Conditional SQL update</text><text x="720" y="134" class="text">UPDATE user SET points = ...</text><text x="720" y="160" class="text">WHERE uid = ? AND points &gt;= ?</text><text x="720" y="186" class="text">affected rows must equal 1</text>
  <path d="M260 140H340M600 140H700" class="arrow"/>
  <rect x="700" y="285" width="330" height="120" rx="12" class="ok"/>
  <text x="720" y="320" class="label">One row updated</text><text x="720" y="348" class="text">Balance or stock reservation</text><text x="720" y="375" class="text">continues in the transaction</text>
  <rect x="340" y="285" width="260" height="120" rx="12" class="fail"/>
  <text x="360" y="320" class="label">Zero rows updated</text><text x="360" y="348" class="text">Balance or stock changed</text><text x="360" y="375" class="text">request fails safely</text>
  <path d="M865 210V285" class="arrow"/><path d="M700 210C630 245 560 270 470 285" class="arrow"/>
  <rect x="40" y="475" width="990" height="78" rx="12" class="box"/>
  <text x="65" y="507" class="label">Safety property</text><text x="65" y="533" class="text">Concurrent redemptions cannot spend the same points or reserve the same stock unit; @Transactional rolls back related order changes on failure.</text>
</svg>
